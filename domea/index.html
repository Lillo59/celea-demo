<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="icon" href="../favicon.svg" type="image/svg+xml">

<body>
<title>Domèa Immobiliare (sito di esempio)</title>
<meta name="description" content="Sito di esempio realizzato da Celea per un'agenzia immobiliare inventata: immobili, vendita, assistente virtuale che qualifica i contatti, fissa, sposta e disdice le visite e manda i promemoria, e la vista del titolare.">
<meta name="robots" content="noindex">
<style>
:root{--bg:#F5F3EF;--surface:#FFFFFF;--ink:#1D2433;--muted:#555C6B;--line:#E2DDD3;--acc:#1F3A5F;--acc-ink:#FFFFFF;--acc-text:#1F3A5F;--label:#7A5A1C;--soft:#ECE6DA;--warn:#A1470F;--band:#1D2433;--band-ink:#F5F3EF;--shadow:rgba(29,36,51,.14);--ok-bg:#DCE6F2;--ok-ink:#173052;--wa-bg:#0B141A;--wa-bub:#FFFFFF;--f-display:'Instrument Serif',Georgia,'Times New Roman',serif;--f-body:'Figtree',ui-sans-serif,system-ui,sans-serif;--w-display:400;--w-h3:700;--track:-.01em;--r:18px;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12161F;--surface:#1A2030;--ink:#ECEFF4;--muted:#A7AEBD;--line:#2A3245;--acc:#A9C2E6;--acc-ink:#0F1A2C;--acc-text:#B4CBEB;--label:#D9B26A;--soft:#222A3B;--warn:#A1470F;--band:#0B0E15;--band-ink:#ECEFF4;--shadow:rgba(0,0,0,.45);--ok-bg:#24395A;--ok-ink:#DCE6F2;--wa-bg:#0B141A;--wa-bub:#FFFFFF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161F;--surface:#1A2030;--ink:#ECEFF4;--muted:#A7AEBD;--line:#2A3245;--acc:#A9C2E6;--acc-ink:#0F1A2C;--acc-text:#B4CBEB;--label:#D9B26A;--soft:#222A3B;--warn:#A1470F;--band:#0B0E15;--band-ink:#ECEFF4;--shadow:rgba(0,0,0,.45);--ok-bg:#24395A;--ok-ink:#DCE6F2;--wa-bg:#0B141A;--wa-bub:#FFFFFF;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;margin:0;overflow-x:hidden}
h1,h2,h3{font-family:var(--f-display);line-height:1.08;letter-spacing:var(--track,-.02em);margin:0;text-wrap:balance;font-weight:var(--w-display,800)}
h1{font-size:clamp(2.2rem,6.4vw,4.1rem)}
h2{font-size:clamp(1.65rem,4vw,2.5rem)}
h3{font-size:1.18rem;font-weight:var(--w-h3,700);letter-spacing:-.01em}
p{margin:0}
a{color:var(--acc-text)}
button{font:inherit}
:focus-visible{outline:3px solid var(--acc-text);outline-offset:3px;border-radius:6px}
.wrap{max-width:1140px;margin-inline:auto;padding-inline:16px}
@media (min-width:900px){.wrap{padding-inline:48px}}
.skip{position:absolute;left:-9999px;top:8px;z-index:100;background:var(--surface);color:var(--ink);padding:10px 14px;border-radius:10px}
.skip:focus{left:8px}
section{padding-block:64px}
@media (min-width:900px){section{padding-block:88px}}
.label{font-family:var(--f-body);font-size:.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--label)}
.lead{font-size:1.14rem;color:var(--muted);max-width:60ch}
.head{display:grid;gap:12px;margin-bottom:36px;max-width:720px}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:999px;font-family:var(--f-body);font-weight:700;font-size:1rem;text-decoration:none;border:2px solid var(--acc);cursor:pointer;background:var(--acc);color:var(--acc-ink);text-align:center}
.btn.line{background:transparent;color:var(--acc-text);border-color:currentColor}
.btn.sm{min-height:40px;padding:7px 15px;font-size:.92rem}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.alt{background:var(--soft)}

/* banda d'esempio */
.sample{background:var(--band);color:var(--band-ink);font-size:.9rem;line-height:1.45}
.sample .wrap{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;justify-content:space-between;padding-block:8px}
.sample a{color:var(--band-ink);font-weight:700}

/* intestazione */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;min-height:64px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:var(--w-display,800);font-size:1.3rem;color:var(--ink);text-decoration:none;margin-right:auto;white-space:nowrap;letter-spacing:-.01em}
.brand svg{width:30px;height:30px;color:var(--acc-text);flex:none}
nav.menu{display:none;gap:22px}
nav.menu a{color:var(--ink);text-decoration:none;font-weight:600;font-size:.95rem;padding:6px 0;border-bottom:2px solid transparent;white-space:nowrap}
nav.menu a[aria-current="page"]{border-color:var(--acc-text);color:var(--acc-text)}
nav.menu a .badge,.drawer-nav .badge{display:inline-block;min-width:1.4em;padding:0 5px;margin-left:5px;border-radius:999px;background:var(--warn);color:#fff;font-size:.75rem;text-align:center;line-height:1.4em}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.langs button{appearance:none;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:.8rem;padding:7px 8px;cursor:pointer;min-width:34px;min-height:36px}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.menu-btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;width:40px;height:40px;padding:0;display:grid;place-items:center;cursor:pointer;flex:none}
@media (max-width:400px){.brand{font-size:1.1rem;gap:6px}.brand svg{width:24px;height:24px}.langs button{min-width:30px;padding:6px 4px}header.top .wrap{gap:6px}}
.hcta{display:none}
@media (min-width:1020px){nav.menu{display:flex}.menu-btn{display:none}}
@media (min-width:640px){.hcta{display:inline-flex}}
.drawer-nav{display:none;border-top:1px solid var(--line);background:var(--bg)}
.drawer-nav.open{display:block}
.drawer-nav a{display:block;padding:14px 16px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700}
.drawer-nav a[aria-current="page"]{color:var(--acc-text)}

/* hero */
.hero{padding-block:44px 64px}
.hero .wrap{display:grid;gap:36px;grid-template-columns:minmax(0,1fr)}
@media (min-width:960px){.hero .wrap{grid-template-columns:1.08fr .92fr;align-items:center;gap:60px}.hero{padding-block:72px 96px}}
.hero-text{display:grid;gap:22px;min-width:0}
.hero h1 em{font-style:normal;color:var(--acc-text)}
.facts{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0}
.facts li{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.9rem;font-weight:700}

/* chat */
.chat{background:var(--surface);border:1px solid var(--line);border-radius:24px;display:flex;flex-direction:column;height:560px;max-height:82vh;min-width:0;overflow:hidden;box-shadow:0 24px 60px var(--shadow)}
.chat-h{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-weight:800;font-family:var(--f-display);flex:none}
.chat-h .who{min-width:0;flex:1}
.chat-h b{display:block;line-height:1.2;font-size:.98rem}
.chat-h small{color:var(--muted);font-size:.8rem;display:block}
.chat-h .x{appearance:none;border:0;background:transparent;color:var(--ink);font-size:1.5rem;line-height:1;cursor:pointer;padding:4px 8px;border-radius:8px}
.log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
.m{max-width:86%;padding:9px 13px;border-radius:16px;font-size:.96rem;line-height:1.42;overflow-wrap:anywhere;white-space:pre-line}
.m.a{align-self:flex-start;background:var(--soft);border-top-left-radius:5px}
.m.u{align-self:flex-end;background:var(--acc);color:var(--acc-ink);border-top-right-radius:5px}
.m.s{align-self:center;background:transparent;border:1px dashed var(--line);color:var(--muted);font-size:.83rem;text-align:center;max-width:94%}
.m.r{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--acc-text);border-radius:12px;max-width:92%}
.m.r .tag{display:block;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--label);margin-bottom:3px}
.typing{align-self:flex-start;color:var(--muted);font-size:.85rem;padding:2px 6px}
.opts{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;justify-content:flex-end;border-top:1px solid var(--line)}
.opts button{appearance:none;border:1.5px solid var(--acc-text);background:var(--surface);color:var(--acc-text);border-radius:999px;padding:7px 13px;font-size:.9rem;font-weight:700;cursor:pointer;min-height:38px}
.opts button:hover{background:var(--soft)}
.chat form{display:flex;gap:6px;padding:0 12px 8px}
.chat input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:9px 14px;font:inherit;font-size:.95rem}
.chat form button{appearance:none;border:0;background:var(--acc);color:var(--acc-ink);border-radius:999px;padding:0 15px;font-weight:700;cursor:pointer;min-height:40px}
.chat-note{font-size:.8rem;color:var(--muted);padding:0 14px 10px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px}
.chat-note a{font-weight:700}
.fab{position:fixed;right:16px;bottom:16px;z-index:30;display:none;align-items:center;gap:8px;border:0;background:var(--acc);color:var(--acc-ink);border-radius:999px;padding:13px 18px;font-weight:700;box-shadow:0 10px 30px var(--shadow);cursor:pointer}
.fab.show{display:inline-flex}
.dock{position:fixed;inset:auto 16px 16px auto;z-index:40;width:min(400px,calc(100vw - 32px))}
.dock .chat{height:min(600px,calc(100dvh - 32px));max-height:none}
@media (max-width:600px){.dock{inset:0;width:auto}.dock .chat{height:100dvh;border-radius:0;border:0}}

/* blocchi comuni */
.grid2{display:grid;gap:28px}
@media (min-width:860px){.grid2{grid-template-columns:1fr 1fr;gap:56px}}
.grid3{display:grid;gap:16px}
@media (min-width:760px){.grid3{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r,18px);padding:22px;display:grid;gap:8px;align-content:start;min-width:0}
.card p{color:var(--muted)}
.list{display:grid;border-top:1px solid var(--line)}
@media (min-width:760px){.list{grid-template-columns:1fr 1fr;column-gap:48px}}
.list>div{display:grid;gap:4px;padding:18px 0;border-bottom:1px solid var(--line)}
.list p{color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:14px;counter-reset:s}
@media (min-width:860px){.steps{grid-template-columns:repeat(3,1fr)}}
.steps li{background:var(--surface);border:1px solid var(--line);border-radius:var(--r,18px);padding:22px;display:grid;gap:6px;align-content:start}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--f-display);font-weight:var(--w-display,800);font-size:1.7rem;color:var(--acc-text);line-height:1}
.steps p{color:var(--muted)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
td,th{text-align:left;padding:11px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:700;padding-right:12px}
td:last-child{text-align:right}
.kv{display:grid;gap:4px}
.kv .v{font-weight:700}
.note{border-left:4px solid var(--warn);padding:12px 16px;background:var(--surface);border-radius:0 12px 12px 0}
.faq{display:grid;border-top:1px solid var(--line);max-width:820px}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;padding:18px 0;font-weight:700;font-size:1.05rem;list-style-position:outside}
.faq .ans{padding-bottom:18px;color:var(--muted);max-width:68ch}
.band-cta{display:grid;gap:18px;align-items:center;background:var(--ink);color:var(--bg);border-radius:24px;padding:32px 24px}
.band-cta p{opacity:.85}
.band-cta .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}
@media (min-width:860px){.band-cta{grid-template-columns:1fr auto;padding:40px 44px}}
.strip{display:grid;gap:0;border-block:1px solid var(--line)}
@media (min-width:760px){.strip{grid-template-columns:repeat(3,1fr)}}
.strip>div{padding:22px 0;display:grid;gap:6px}
@media (min-width:760px){.strip>div{padding:26px 24px}.strip>div+div{border-left:1px solid var(--line)}.strip>div:first-child{padding-left:0}}
.strip b{font-family:var(--f-display);font-size:1.15rem;font-weight:var(--w-h3,700)}
.strip p{color:var(--muted)}

/* vista del titolare */
.owner-top{display:grid;gap:10px;margin-bottom:28px}
.ex{display:inline-block;background:var(--soft);border:1px dashed var(--line);border-radius:999px;padding:4px 12px;font-size:.85rem;color:var(--muted);font-weight:700;justify-self:start}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:28px}
@media (min-width:860px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:2px}
.kpi b{font-family:var(--f-display);font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:.9rem;line-height:1.35}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:12px;align-content:start;min-width:0}
.panel h3{font-size:1.1rem}
.rows{display:grid}
.row{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:start}
.row:last-child{border-bottom:0}
.row time{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);min-width:3.2em}
.row .t{min-width:0}
.row .t small{display:block;color:var(--muted);font-size:.86rem}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.78rem;font-weight:700;margin:2px 4px 0 0;border:1px solid var(--line)}
.pill.ok{background:var(--ok-bg);color:var(--ok-ink);border-color:transparent}
.pill.wait{background:var(--soft);color:var(--ink)}
.pill.alert{background:var(--warn);color:#fff;border-color:transparent}
.owner-grid{display:grid;gap:16px}
@media (min-width:960px){.owner-grid{grid-template-columns:1.2fr .8fr}}
.phone{background:var(--ink);border-radius:30px;padding:12px;max-width:330px;width:100%;justify-self:center}
.phone .scr{background:var(--wa-bg);border-radius:22px;padding:14px;display:grid;gap:8px;min-height:300px;align-content:start}
.phone .bub{background:var(--wa-bub);color:#1b1b1b;border-radius:12px;border-top-left-radius:4px;padding:9px 11px;font-size:.9rem;line-height:1.4;max-width:92%;box-shadow:0 1px 1px rgba(0,0,0,.08);white-space:pre-line}
.phone .me{justify-self:end;background:#D9FDD3;border-top-left-radius:12px;border-top-right-radius:4px}
.phone .who{color:#e9edef;font-size:.85rem;font-weight:700;padding:2px 4px 6px}
.live:empty::before{content:attr(data-empty);color:var(--muted);font-size:.92rem}

footer.site{background:var(--band);color:var(--band-ink);padding-block:44px 90px}
footer.site .wrap{display:grid;gap:14px}
footer.site p{max-width:74ch;opacity:.92}
footer.site a{color:var(--band-ink);font-weight:700}
footer.site .cols{display:grid;gap:18px}
@media (min-width:860px){footer.site .cols{grid-template-columns:1.3fr 1fr}}
[tabindex="-1"]:focus{outline:none}
.phone{align-self:start}
.hcta{white-space:nowrap}
@media (min-width:1020px) and (max-width:1239px){.hcta{display:none}}

h1{font-size:clamp(2.6rem,7.4vw,4.8rem)}h2{font-size:clamp(2rem,4.6vw,3rem)}h3{font-family:var(--f-body)}.hero h1 em{font-style:italic}.steps li::before,.kpi b{font-family:var(--f-display);font-weight:400}.props{display:grid;gap:18px}@media (min-width:760px){.props{grid-template-columns:1fr 1fr}}.prop{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:grid;min-width:0}.prop .art{background:var(--soft);aspect-ratio:16/9;display:grid;place-items:center;color:var(--acc-text)}.prop .art svg{width:100%;height:100%}.prop .body{padding:20px;display:grid;gap:8px}.prop .price{font-family:var(--f-display);font-size:1.7rem;line-height:1}.prop ul{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px}.prop li{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.85rem;color:var(--muted)}.prop .cta{margin-top:6px}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="logo" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M5.5 9.5V20h13V9.5M10 20v-5.5h4V20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol></svg>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#home" data-go="home"><svg aria-hidden="true"><use href="#logo"/></svg>Domèa</a>
    <nav class="menu" id="nav" aria-label="Menu"></nav>
    <div class="langs" id="langs" role="group"><button type="button" data-l="it" lang="it" aria-label="Italiano">IT</button><button type="button" data-l="en" lang="en" aria-label="English">EN</button><button type="button" data-l="de" lang="de" aria-label="Deutsch">DE</button></div>
    <button class="menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="drawer-nav" aria-label="Menu"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <a class="btn sm hcta" id="hcta" href="#home" data-chat="start">Chat</a>
  </div>

</header>
<main id="main" tabindex="-1"></main>
<div id="chat-park" hidden></div>

  </div>
</div>
<button class="fab" id="fab" type="button"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span id="fab-t">Chat</span></button>

<script>
window.SITE={i18n:{}};
(function(){
var CELEA="https://www.celea.it/";
/* illustrazioni al tratto (nessuna foto: gli immobili sono inventati) */

home:`<section class="hero"><div class="wrap">
<div class="hero-text"><p class="label">Agenzia immobiliare · esempio</p>
<h1>La casa giusta non aspetta <em>l'orario d'ufficio.</em></h1>
<p class="lead">Compravendite in città, al mare e in collina. Ci scriva quando vuole: l'assistente risponde sugli immobili, fissa la visita con l'agente, Le manda il promemoria il giorno prima e passa a una persona quando serve.</p>
<div class="cta"><a class="btn" href="#immobili" data-go="immobili">Veda gli immobili</a><a class="btn line" href="#vendere" data-go="vendere">Vorrei vendere casa</a></div>

<div data-chat-slot></div></div></section>
<section class="alt"><div class="wrap"><div class="head"><p class="label">Perché scriverci</p><h2>Ogni richiesta ha una risposta, ogni visita un promemoria.</h2></div>
<div class="strip"><div><b>Risposta anche alle 23</b><p>Chi scrive da un annuncio la sera riceve subito le informazioni e un orario di visita.</p></div><div><b>Contatti già qualificati</b><p>Mutuo, tempi e zona: l'agente sa con chi parla prima di chiamare.</p></div><div><b>Visite che non saltano</b><p>Il giorno prima arriva il promemoria con indirizzo e nome dell'agente; si conferma, si sposta o si annulla con un numero.</p></div></div></div></section>
<section><div class="wrap"><div class="head"><p class="label">In evidenza</p><h2>Alcuni immobili</h2><p class="lead">Immobili e prezzi d'esempio: chieda una visita e veda come risponde l'assistente.</p></div>%P2%
<p style="margin-top:22px"><a href="#immobili" data-go="immobili"><b>Tutti gli immobili →</b></a></p></div></section>
<section><div class="wrap"><div class="band-cta"><div><p class="label" style="color:inherit;opacity:.8">Per il titolare dell'agenzia</p><h2 style="margin-top:8px">Cosa trova l'agenzia la mattina?</h2><p style="margin-top:10px">I contatti della notte già qualificati, le visite in agenda, le disdette con l'orario liberato e i promemoria confermati. Lo vede in un colpo d'occhio.</p></div><a class="btn" href="#titolare" data-go="titolare">Apra la vista del titolare</a></div></div></section>`,

vendere:`<section><div class="wrap"><div class="head"><p class="label">Vendere casa</p><h1>Vendere con un prezzo realistico</h1><p class="lead">Tre passi, con un solo agente che La segue dall'inizio alla fine.</p></div>
<ol class="steps"><li><h3>Valutazione</h3><p>L'agente viene a vedere la casa, controlla i documenti e Le propone un prezzo realistico, senza impegno.</p></li><li><h3>Promozione e visite</h3><p>Foto, planimetria e annunci. L'assistente risponde ai contatti a ogni ora e fissa solo visite con persone interessate davvero.</p></li><li><h3>Trattativa e rogito</h3><p>Proposte scritte, accordo e accompagnamento fino al notaio.</p></li></ol></div></section>
<section class="alt"><div class="wrap grid2"><div class="kv"><p class="label">Trasparenza</p><h2>Sempre per iscritto</h2><p class="muted" style="margin-top:12px">La provvigione si concorda per iscritto prima di iniziare. Dopo ogni visita Le scriviamo com'è andata.</p></div>
<div class="kv"><p class="label">Valutazione</p><h2>Cominci da qui</h2><p class="muted" style="margin-top:12px">L'assistente raccoglie i dati principali e un agente La richiama per fissare il sopralluogo.</p><div class="cta" style="margin-top:16px"><a class="btn" href="#home" data-chat="vv">Chieda una valutazione</a></div></div></div></section>`,
agenzia:`<section><div class="wrap"><div class="head"><p class="label">Orari e contatti</p><h1>Quando siamo in agenzia</h1></div>

domande:`<section><div class="wrap"><div class="head"><p class="label">Domande</p><h1>Le domande più frequenti</h1></div><div class="faq">
<details><summary>Con chi parlo quando scrivo la sera?</summary><div class="ans"><p>Con l'assistente virtuale dell'agenzia, che si presenta sempre come tale. Risponde sugli immobili, fissa, sposta e disdice le visite e passa la conversazione a un agente quando serve.</p></div></details>
<details><summary>Perché l'assistente mi chiede del mutuo?</summary><div class="ans"><p>Per proporLe gli immobili e la visita giusti, e perché l'agente sappia già come aiutarLa. Può sempre rispondere che preferisce parlarne con l'agente.</p></div></details>
<details><summary>Posso spostare o annullare una visita su WhatsApp?</summary><div class="ans"><p>Sì, a qualsiasi ora. L'agente viene avvisato subito e l'orario torna libero per altri clienti.</p></div></details>
<details><summary>Che cosa dice il promemoria?</summary><div class="ans"><p>Giorno, ora, indirizzo dell'immobile e nome e numero dell'agente che La accompagna. Risponde 1 per confermare, 2 per spostare, 3 per annullare.</p></div></details>
<details><summary>L'assistente può trattare sul prezzo?</summary><div class="ans"><p>No. Le proposte e le trattative le segue sempre un agente, per iscritto.</p></div></details>

home:`<section class="hero"><div class="wrap">
<div class="hero-text"><p class="label">Estate agency · sample</p>
<h1>The right home doesn't wait for <em>office hours.</em></h1>
<p class="lead">Homes for sale in town, by the sea and in the hills. Message us whenever you like: the assistant answers questions about properties, books the viewing with an agent, sends you a reminder the day before and hands over to a person when needed.</p>
<div class="cta"><a class="btn" href="#en/immobili" data-go="immobili">See the properties</a><a class="btn line" href="#en/vendere" data-go="vendere">I want to sell</a></div>
<ul class="facts" aria-label="At a glance"><li>On WhatsApp and the website</li><li>Italian, English and German</li><li>Viewings on Saturdays too</li></ul></div>
<div data-chat-slot></div></div></section>
<section class="alt"><div class="wrap"><div class="head"><p class="label">Why message us</p><h2>Every enquiry gets an answer, every viewing a reminder.</h2></div>
<div class="strip"><div><b>Answers even at 11 pm</b><p>Anyone writing from a listing in the evening gets the details and a viewing time straight away.</p></div><div><b>Leads already qualified</b><p>Mortgage, timing and area: the agent knows who they're talking to before calling.</p></div><div><b>Viewings that happen</b><p>The day before, a reminder with the address and the agent's name; confirm, move or cancel with a number.</p></div></div></div></section>
<section><div class="wrap"><div class="head"><p class="label">Featured</p><h2>Some of our properties</h2><p class="lead">Sample properties and prices: request a viewing and see how the assistant replies.</p></div>%P2%
<p style="margin-top:22px"><a href="#en/immobili" data-go="immobili"><b>All properties →</b></a></p></div></section>
<section><div class="wrap"><div class="band-cta"><div><p class="label" style="color:inherit;opacity:.8">For the agency owner</p><h2 style="margin-top:8px">What does the agency find in the morning?</h2><p style="margin-top:10px">Overnight leads already qualified, viewings in the diary, cancellations with the slot freed and confirmed reminders. All at a glance.</p></div><a class="btn" href="#en/titolare" data-go="titolare">Open the owner view</a></div></div></section>`,

vendere:`<section><div class="wrap"><div class="head"><p class="label">Sell your home</p><h1>Selling at a realistic price</h1><p class="lead">Three steps, with one agent by your side from start to finish.</p></div>
<ol class="steps"><li><h3>Valuation</h3><p>The agent visits your home, checks the documents and suggests a realistic price, with no obligation.</p></li><li><h3>Marketing and viewings</h3><p>Photos, floor plan and listings. The assistant answers enquiries at any hour and books viewings only with genuinely interested people.</p></li><li><h3>Negotiation and completion</h3><p>Written offers, agreement and support all the way to the notary.</p></li></ol></div></section>
<section class="alt"><div class="wrap grid2"><div class="kv"><p class="label">Transparency</p><h2>Always in writing</h2><p class="muted" style="margin-top:12px">The commission is agreed in writing before we start. After each viewing we tell you how it went.</p></div>
<div class="kv"><p class="label">Valuation</p><h2>Start here</h2><p class="muted" style="margin-top:12px">The assistant takes the main details and an agent calls you back to arrange the visit.</p><div class="cta" style="margin-top:16px"><a class="btn" href="#en" data-chat="vv">Request a valuation</a></div></div></div></section>`,

domande:`<section><div class="wrap"><div class="head"><p class="label">FAQ</p><h1>Frequently asked questions</h1></div><div class="faq">
<details><summary>Who am I talking to when I write in the evening?</summary><div class="ans"><p>The agency's virtual assistant, which always introduces itself as such. It answers questions about properties, books, moves and cancels viewings and passes the conversation to an agent when needed.</p></div></details>
<details><summary>Why does the assistant ask about a mortgage?</summary><div class="ans"><p>To suggest the right properties and viewing, and so the agent already knows how to help you. You can always say you'd rather discuss it with the agent.</p></div></details>
<details><summary>Can I move or cancel a viewing on WhatsApp?</summary><div class="ans"><p>Yes, at any hour. The agent is told straight away and the slot becomes free for other clients.</p></div></details>
<details><summary>What does the reminder say?</summary><div class="ans"><p>Day, time, the property's address and the name and number of the agent meeting you. Reply 1 to confirm, 2 to move, 3 to cancel.</p></div></details>
<details><summary>Can the assistant negotiate the price?</summary><div class="ans"><p>No. Offers and negotiations are always handled by an agent, in writing.</p></div></details>
<details><summary>Do you speak English or German?</summary><div class="ans"><p>The assistant replies in Italian, English and German, and property details are available in both languages too.</p></div></details>
</div></div></section>`,

home:`<section class="hero"><div class="wrap">
<div class="hero-text"><p class="label">Immobilienagentur · Beispiel</p>
<h1>Das richtige Zuhause wartet nicht auf <em>Bürozeiten.</em></h1>
<p class="lead">Immobilien in der Stadt, am Meer und in den Hügeln. Schreiben Sie uns, wann Sie möchten: Der Assistent beantwortet Fragen zu den Objekten, vereinbart die Besichtigung mit einem Makler, schickt Ihnen am Vortag eine Erinnerung und übergibt bei Bedarf an einen Menschen.</p>
<div class="cta"><a class="btn" href="#de/immobili" data-go="immobili">Immobilien ansehen</a><a class="btn line" href="#de/vendere" data-go="vendere">Ich möchte verkaufen</a></div>
<ul class="facts" aria-label="Kurz gesagt"><li>Per WhatsApp und auf der Website</li><li>Italienisch, Englisch und Deutsch</li><li>Besichtigungen auch samstags</li></ul></div>
<div data-chat-slot></div></div></section>
<section class="alt"><div class="wrap"><div class="head"><p class="label">Warum uns schreiben</p><h2>Jede Anfrage bekommt eine Antwort, jede Besichtigung eine Erinnerung.</h2></div>
<div class="strip"><div><b>Antwort auch um 23 Uhr</b><p>Wer abends über ein Inserat schreibt, erhält sofort die Details und einen Besichtigungstermin.</p></div><div><b>Bereits qualifizierte Interessenten</b><p>Kredit, Zeitrahmen und Lage: Der Makler weiß vor dem Anruf, mit wem er spricht.</p></div><div><b>Besichtigungen, die stattfinden</b><p>Am Vortag eine Erinnerung mit Adresse und Namen des Maklers; mit einer Zahl bestätigen, verschieben oder absagen.</p></div></div></div></section>
<section><div class="wrap"><div class="head"><p class="label">Ausgewählt</p><h2>Einige unserer Immobilien</h2><p class="lead">Beispielobjekte und -preise: Fragen Sie eine Besichtigung an und sehen Sie, wie der Assistent antwortet.</p></div>%P2%
<p style="margin-top:22px"><a href="#de/immobili" data-go="immobili"><b>Alle Immobilien →</b></a></p></div></section>
<section><div class="wrap"><div class="band-cta"><div><p class="label" style="color:inherit;opacity:.8">Für die Inhaber der Agentur</p><h2 style="margin-top:8px">Was findet die Agentur am Morgen vor?</h2><p style="margin-top:10px">Die Interessenten der Nacht bereits qualifiziert, Besichtigungen im Kalender, Absagen mit frei gewordenem Termin und bestätigte Erinnerungen. Alles auf einen Blick.</p></div><a class="btn" href="#de/titolare" data-go="titolare">Ansicht für die Agentur öffnen</a></div></div></section>`,
immobili:`<section><div class="wrap"><div class="head"><p class="label">Immobilien</p><h1>Immobilien zum Verkauf</h1><p class="lead">Beispielobjekte und -preise. Für jedes können Sie eine Besichtigung anfragen: Der Assistent stellt zwei Fragen und schlägt einen Termin mit einem Makler vor.</p></div>%P4%</div></section>`,
vendere:`<section><div class="wrap"><div class="head"><p class="label">Verkaufen</p><h1>Verkaufen zu einem realistischen Preis</h1><p class="lead">Drei Schritte, mit einem Makler, der Sie von Anfang bis Ende begleitet.</p></div>
<ol class="steps"><li><h3>Bewertung</h3><p>Der Makler besichtigt Ihre Immobilie, prüft die Unterlagen und schlägt Ihnen unverbindlich einen realistischen Preis vor.</p></li><li><h3>Vermarktung und Besichtigungen</h3><p>Fotos, Grundriss und Inserate. Der Assistent beantwortet Anfragen rund um die Uhr und vereinbart nur Besichtigungen mit wirklich Interessierten.</p></li><li><h3>Verhandlung und Notartermin</h3><p>Schriftliche Angebote, Einigung und Begleitung bis zum Notar.</p></li></ol></div></section>
<section class="alt"><div class="wrap grid2"><div class="kv"><p class="label">Transparenz</p><h2>Immer schriftlich</h2><p class="muted" style="margin-top:12px">Die Provision wird vor Beginn schriftlich vereinbart. Nach jeder Besichtigung berichten wir Ihnen, wie sie verlaufen ist.</p></div>
<div class="kv"><p class="label">Bewertung</p><h2>Beginnen Sie hier</h2><p class="muted" style="margin-top:12px">Der Assistent nimmt die wichtigsten Daten auf und ein Makler ruft Sie zurück, um den Termin zu vereinbaren.</p><div class="cta" style="margin-top:16px"><a class="btn" href="#de" data-chat="vv">Bewertung anfragen</a></div></div></div></section>`,

domande:`<section><div class="wrap"><div class="head"><p class="label">Fragen</p><h1>Häufige Fragen</h1></div><div class="faq">
<details><summary>Mit wem spreche ich, wenn ich abends schreibe?</summary><div class="ans"><p>Mit dem virtuellen Assistenten der Agentur, der sich immer als solcher vorstellt. Er beantwortet Fragen zu den Immobilien, vereinbart, verschiebt und storniert Besichtigungen und übergibt das Gespräch bei Bedarf an einen Makler.</p></div></details>
<details><summary>Warum fragt der Assistent nach einem Kredit?</summary><div class="ans"><p>Um Ihnen die passenden Immobilien und Besichtigungen vorzuschlagen und damit der Makler schon weiß, wie er helfen kann. Sie können jederzeit sagen, dass Sie das lieber mit dem Makler besprechen.</p></div></details>
<details><summary>Kann ich eine Besichtigung per WhatsApp verschieben oder absagen?</summary><div class="ans"><p>Ja, rund um die Uhr. Der Makler wird sofort informiert und der Termin wird für andere Kunden frei.</p></div></details>
<details><summary>Was steht in der Erinnerung?</summary><div class="ans"><p>Tag, Uhrzeit, Adresse der Immobilie sowie Name und Nummer des begleitenden Maklers. Antworten Sie 1 zum Bestätigen, 2 zum Verschieben, 3 zum Absagen.</p></div></details>
<details><summary>Kann der Assistent über den Preis verhandeln?</summary><div class="ans"><p>Nein. Angebote und Verhandlungen führt immer ein Makler, schriftlich.</p></div></details>
<details><summary>Sprechen Sie Englisch oder Deutsch?</summary><div class="ans"><p>Der Assistent antwortet auf Italienisch, Englisch und Deutsch, und die Exposés gibt es ebenfalls in beiden Sprachen.</p></div></details>
</div></div></section>`,

<script>
(function(){
  "use strict";
  var S=window.SITE, LANGS=["it","en","de"];
  var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var $=function(s,r){return (r||document).querySelector(s);};
  var lang="it", page="home", L=S.i18n.it, events=[], seen=0, firstRender=true;

  /* ---------- chat ---------- */
  var chat=$("#chat"), log=$("#log"), opts=$("#opts"), form=$("#chat-form"), input=$("#chat-input");
  var slotHome=$("#chat-park"), dock=$("#dock"), fab=$("#fab"), run=0;
  function greet(){
    var h=new Date().getHours();
    if(lang==="it") return (h>=5&&h<18)?"Buongiorno":"Buonasera";
    if(lang==="en") return h>=5&&h<12?"Good morning":(h>=12&&h<18?"Good afternoon":"Good evening");
    return h>=5&&h<11?"Guten Morgen":(h>=11&&h<18?"Guten Tag":"Guten Abend");
  }
  function fill(t){return t.replace(/%HI%/g,greet());}
  function add(cls,t,tag){
    var d=document.createElement("div"); d.className="m "+cls;
    if(tag){var s=document.createElement("span");s.className="tag";s.textContent=tag;d.appendChild(s);}
    d.appendChild(document.createTextNode(fill(t))); log.appendChild(d); log.scrollTop=log.scrollHeight; return d;
  }
  function wait(ms){return new Promise(function(r){setTimeout(r,reduce?40:ms);});}
  function note(text){
    var d=new Date(), hh=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
    events.unshift({t:hh,text:text,lang:lang}); renderLive(); badge();
  }
  async function go(k,silentUser){
    var C=L.chat, n=C.flows[k]; if(!n){n=C.flows[C.fb];}
    var id=++run; opts.innerHTML="";
    if(n.u&&!silentUser) add("u",n.u);
    if(n.r){ await wait(300); if(id!==run) return; add("s",n.r[0]); await wait(500); if(id!==run) return; add("r",n.r[1],n.r[2]); }
    var a=n.a||[];
    for(var i=0;i<a.length;i++){
      var ty=document.createElement("div"); ty.className="typing"; ty.textContent=L.ui.typing; log.appendChild(ty); log.scrollTop=log.scrollHeight;
      await wait(Math.min(1300,450+a[i].length*7)); ty.remove(); if(id!==run) return; add("a",a[i]);
    }
    if(n.s){await wait(300); if(id!==run) return; add("s",n.s);}
    if(n.log){note(n.log);}
    var list=n.o||C.end;
    list.forEach(function(o){
      var b=document.createElement("button"); b.type="button"; b.textContent=o[0];
      b.addEventListener("click",function(){ if(o[1]==="__owner"){navigate("titolare");return;} if(o[1]==="start"){log.innerHTML="";} go(o[1]); });
      opts.appendChild(b);
    });
  }
  function startChat(){ log.innerHTML=""; go("start"); }
  form.addEventListener("submit",function(e){
    e.preventDefault(); var q=input.value.trim(); if(!q) return; input.value="";
    add("u",q); var C=L.chat, key=C.fb;
    for(var i=0;i<C.kw.length;i++){ if(C.kw[i][0].test(q)){ key=C.kw[i][1]; break; } }
    go(key,true);
  });
  function openDock(){ dock.hidden=false; fab.classList.remove("show"); chat.setAttribute("role","dialog"); chat.setAttribute("aria-modal","false"); setTimeout(function(){input.focus();},30); }
  function closeDock(){ dock.hidden=true; if(page!=="home") fab.classList.add("show"); fab.focus(); }
  fab.addEventListener("click",openDock);
  $("#chat-x").addEventListener("click",closeDock);
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&!dock.hidden) closeDock(); });
  function placeChat(){
    var slot=$("[data-chat-slot]",$("#main"));
    if(slot){ slot.appendChild(chat); dock.hidden=true; fab.classList.remove("show"); $("#chat-x").hidden=true; chat.removeAttribute("role"); }
    else { dock.appendChild(chat); $("#chat-x").hidden=false; if(dock.hidden) fab.classList.add("show"); }
  }
  function openChatWith(k){
    if(!$("[data-chat-slot]",$("#main"))) openDock(); else chat.scrollIntoView({behavior:reduce?"auto":"smooth",block:"center"});
    log.innerHTML=""; go(k);
  }

  /* ---------- vista del titolare: registro in tempo reale ---------- */
  function renderLive(){
    var box=$("[data-live]"); if(!box) return;
    box.setAttribute("data-empty",L.ui.liveEmpty); box.innerHTML="";
    events.forEach(function(ev){
      var r=document.createElement("div"); r.className="row";
      var t=document.createElement("time"); t.textContent=ev.t;
      var x=document.createElement("div"); x.className="t"; x.textContent=ev.text;
      var p=document.createElement("span"); p.className="pill ok"; p.textContent=L.ui.livePill; x.appendChild(document.createElement("br")); x.appendChild(p);
      r.appendChild(t); r.appendChild(x); box.appendChild(r);
    });
  }
  function badge(){
    document.querySelectorAll("[data-badge]").forEach(function(b){
      var n=page==="titolare"?0:events.length-seen; b.textContent=n>0?n:""; b.hidden=!(n>0);
      b.setAttribute("aria-label",n>0?(n+" "+L.ui.newEvents):"");
    });
  }

  /* ---------- pagine ---------- */
  function href(p,lg){ lg=lg||lang; var a=(lg==="it"?"":lg+"/")+(p==="home"?"":p); return "#"+(a.replace(/\/$/,"")||"home"); }
  function navigate(p,lg){ var h=href(p,lg); if(location.hash===h){route();} else location.hash=h; }
  function buildNav(){
    var nav=$("#nav"), dn=$("#drawer-nav"); nav.innerHTML=""; dn.innerHTML="";
    L.nav.forEach(function(it){
      [nav,dn].forEach(function(box){
        var a=document.createElement("a"); a.href=href(it[0]); a.setAttribute("data-go",it[0]); a.textContent=it[1];
        if(it[0]==="titolare"){var b=document.createElement("span");b.className="badge";b.setAttribute("data-badge","");b.hidden=true;a.appendChild(b);}
        if(it[0]===page) a.setAttribute("aria-current","page");
        box.appendChild(a);
      });
    });
    $("#menu-btn").setAttribute("aria-label",L.ui.menu); $("#hcta").textContent=L.cta; $("#hcta").href=href("home");
    $("#band").innerHTML=L.band; $("#back").textContent=L.back; $("#skip").textContent=L.ui.skip;
    $("#fab-t").textContent=L.ui.fab; $("#chat-input").placeholder=L.ui.placeholder; $("#chat-input").setAttribute("aria-label",L.ui.placeholder);
    $("#chat-send").textContent=L.ui.send; $("#chat-name").textContent=L.chat.name; $("#chat-sub").textContent=L.chat.sub;
    $("#chat-note").textContent=L.ui.demoNote; $("#chat-owner").textContent=L.ui.ownerLink; $("#chat-owner").href=href("titolare");
    $("#chat-x").setAttribute("aria-label",L.ui.close); $("#log").setAttribute("aria-label",L.chat.name);
    $("#foot").innerHTML=L.footer;
    document.querySelectorAll(".langs button").forEach(function(b){ b.setAttribute("aria-pressed",b.dataset.l===lang?"true":"false"); });
    $("#langs").setAttribute("aria-label",L.ui.langs);
    badge();
  }
  function route(){
    var h=decodeURIComponent(location.hash.slice(1)), parts=h.split("/"), lg="it", p;
    if(LANGS.indexOf(parts[0])>=0){ lg=parts[0]; p=parts[1]||"home"; } else { p=parts[0]||"home"; }
    if(!S.i18n[lg].pages[p]) p="home";
    var langChanged=lg!==lang||firstRender; lang=lg; L=S.i18n[lang]; page=p;
    if(page==="titolare") seen=events.length;
    document.documentElement.lang=lang;
    var main=$("#main"); if(main.contains(chat)) $("#chat-park").appendChild(chat); main.innerHTML=L.pages[page];
    document.title=L.titles[page];
    var md=$('meta[name="description"]'); if(md) md.setAttribute("content",L.desc[page]||L.desc.home);
    buildNav(); $("#drawer-nav").classList.remove("open"); $("#menu-btn").setAttribute("aria-expanded","false");
    placeChat();
    if(langChanged){ events=events.filter(function(e){return e.lang===lang;}); seen=Math.min(seen,events.length); startChat(); }
    renderLive(); badge();
    if(S.init) S.init(lang,page,main);
    if(!firstRender){ window.scrollTo(0,0); var h1=$("h1",main); if(h1){h1.setAttribute("tabindex","-1");h1.focus({preventScroll:true});} }
    firstRender=false;
  }
  document.addEventListener("click",function(e){
    var a=e.target.closest("[data-go],[data-chat],[data-l],#skip");
    if(!a) return;
    if(a.id==="skip"){ e.preventDefault(); var m=$("#main"); m.focus(); return; }
    if(a.hasAttribute("data-l")){ e.preventDefault(); navigate(page,a.dataset.l); return; }
    if(a.hasAttribute("data-chat")){ e.preventDefault(); openChatWith(a.getAttribute("data-chat")); return; }
    if(a.hasAttribute("data-go")){ e.preventDefault(); navigate(a.getAttribute("data-go")); }
  });
  $("#menu-btn").addEventListener("click",function(){ var d=$("#drawer-nav"), o=!d.classList.contains("open"); d.classList.toggle("open",o); this.setAttribute("aria-expanded",o?"true":"false"); });
  window.addEventListener("hashchange",route);
  route();
})();

</script>
